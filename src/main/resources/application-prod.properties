# Production profile (activate with SPRING_PROFILES_ACTIVE=prod). All secrets come from environment variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Never expose the database console on the internet.
spring.h2.console.enabled=false

spring.thymeleaf.cache=true
# Render terminates HTTPS at its proxy; trust its forwarded headers so redirects stay on https.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
