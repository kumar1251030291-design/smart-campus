spring.application.name=smart-campus

# Keep server-rendered HTML, Thymeleaf views and form responses explicitly UTF-8.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
# Keep edited templates visible immediately during local development.
spring.thymeleaf.cache=false

# Store the H2 database in the project folder so data remains after a restart.
spring.datasource.url=jdbc:h2:file:./data/smartcampus
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Run the idempotent schema and sample-data scripts against the persistent H2 database.
spring.sql.init.mode=always

# The console is useful while learning and is intended for local development.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional first-start admin account; configure both values in the environment.
smartcampus.admin.email=${SMART_CAMPUS_ADMIN_EMAIL:}
smartcampus.admin.password=${SMART_CAMPUS_ADMIN_PASSWORD:}

