<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(activeSection)" class="admin-sidebar">
    <a class="brand admin-brand" th:href="@{/admin/dashboard}" aria-label="Smart Campus administration">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>smart<span class="brand-campus">campus</span></span>
    </a>
    <div class="admin-side-label">ADMINISTRATION</div>
    <nav class="admin-side-nav" aria-label="Administration">
        <a th:href="@{/admin/dashboard}" th:classappend="${activeSection == 'dashboard'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">D</span>Dashboard</a>
        <a th:href="@{/admin/resources}" th:classappend="${activeSection == 'resources'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">R</span>Resource Management</a>
        <a th:href="@{/admin/users}" th:classappend="${activeSection == 'users'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">U</span>User Management</a>
        <a th:href="@{/admin/bookings}" th:classappend="${activeSection == 'bookings'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">B</span>Booking Requests</a>
        <a th:href="@{/admin/equipment}" th:classappend="${activeSection == 'equipment'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">E</span>Equipment Tracking</a>
        <a th:href="@{/admin/dashboard#analytics}" th:classappend="${activeSection == 'analytics'} ? ' active' : ''"><span class="side-icon" aria-hidden="true">A</span>Analytics</a>
    </nav>
    <div class="sidebar-bottom">
        <div class="admin-profile">
            <span class="profile-avatar" aria-hidden="true">A</span>
            <span class="profile-copy"><strong th:text="${loggedInUserName}">Administrator</strong><small>Administrator</small></span>
        </div>
        <form method="post" th:action="@{/logout}">
            <button class="admin-logout" type="submit"><span aria-hidden="true">↪</span> Log out</button>
        </form>
    </div>
</aside>
</body>
</html>
