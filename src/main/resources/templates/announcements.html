<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css(v=5)}"><link rel="stylesheet" th:href="@{/css/portal.css(v=5)}">
    <title>Announcements | Smart Campus</title>
</head>
<body>
<header th:replace="~{fragments/navigation :: mainNavigation}"></header>
<main class="portal-shell"><div class="portal-container">
    <section class="dash-welcome">
        <div><p class="portal-kicker">CAMPUS NEWS</p><h1 class="dash-welcome-title">Campus <span>announcements</span></h1>
            <p class="dash-welcome-meta">Events, facility updates and booking guidelines from the campus resource office.</p></div>
    </section>
    <div class="announcement-grid">
        <a class="announcement-tile" th:each="item : ${announcements}" th:href="@{/announcements/{id}(id=${item.announcementId})}">
            <img th:src="@{${item.imagePath}}" th:alt="${item.title}" loading="lazy">
            <span class="announcement-copy">
                <span class="announcement-meta"><span class="portal-pill" th:text="${item.categoryLabel()}"></span><small th:text="${#temporals.format(item.publishedOn, 'dd MMM yyyy')}"></small></span>
                <strong th:text="${item.title}"></strong>
                <small th:text="${item.summary}"></small>
            </span>
        </a>
    </div>
    <div class="portal-empty" th:if="${#lists.isEmpty(announcements)}">There are no announcements at this time.</div>
</div></main>
</body></html>
